name: Deploy To Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' '${{ secrets.DEPLOY_SSH_KEY }}' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" <<'EOF'
            set -e
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            cd /home/ubuntu/excel
            git fetch origin main
            git pull --ff-only origin main
            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi
            PM2_BIN="$(command -v pm2 || true)"
            if [ -z "$PM2_BIN" ] && [ -x "$HOME/.nvm/versions/node/v20.20.2/bin/pm2" ]; then
              PM2_BIN="$HOME/.nvm/versions/node/v20.20.2/bin/pm2"
            fi
            if [ -z "$PM2_BIN" ]; then
              echo "pm2 not found on remote host" >&2
              exit 1
            fi
            "$PM2_BIN" restart codex-web
            "$PM2_BIN" save
          EOF
